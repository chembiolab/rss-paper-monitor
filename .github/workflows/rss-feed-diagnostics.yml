name: RSS feed freshness diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'work/rss_feed_diagnostics.py'
      - '.github/workflows/rss-feed-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python work/rss_feed_diagnostics.py
